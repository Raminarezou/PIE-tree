
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIE Etymology Tree</title>
    <style>
        /* General styles */
        body { font-family: sans-serif; padding: 10px; }
        
        /* Tree styles */
        ul { list-style-type: none; padding-left: 20px; }
        
        /* This is the clickable item */
        .tree-node {
            cursor: pointer; /* Show a "pointer" on hover */
            padding: 5px;
            background-color: #f4f4f4;
            border-bottom: 1px solid #ddd;
            margin-top: 2px;
        }
        
        /* This holds the children, hidden by default */
        .tree-children {
            display: none; /* Hide children by default */
            padding-left: 20px;
            border-left: 1px solid #ccc;
        }
        
        /* This class is added by JavaScript to show the children */
        .open > .tree-children {
            display: block; /* Show children when "open" */
        }
    </style>
</head>
<body>

    <h1>PIE Etymology Project</h1>
    
    <div id="container">
        <p>Loading data... (This may take a moment)</p>
    </div>

    <script>
        // This is the main function that builds the tree
        // It's "recursive" - it calls itself to build children
        function buildTree(dataObject, parentElement) {
            
            // Get all the keys from the data (e.g., "Category:Lemmas")
            const keys = Object.keys(dataObject);

            keys.forEach(key => {
                // 1. Create the list item (the container)
                const li = document.createElement('li');
                
                // 2. Create the visible, clickable node
                const node = document.createElement('div');
                node.className = 'tree-node';
                node.textContent = key; // Set the text
                
                // 3. Create the container for children (initially empty and hidden)
                const childrenContainer = document.createElement('ul');
                childrenContainer.className = 'tree-children';

                // 4. Put the node and its children container into the list item
                li.appendChild(node);
                li.appendChild(childrenContainer);
                
                // 5. Add this new item to the parent element in the HTML
                parentElement.appendChild(li);

                // 6. The "Magic": Add a click listener
                node.addEventListener('click', () => {
                    // Check if we've already built the children
                    // We only build it ONCE, on the first click
                    if (childrenContainer.innerHTML === '') {
                        
                        // Check if this node actually has children
                        const nodeData = dataObject[key];
                        if (nodeData && nodeData.children) {
                            // If it does, call this same function
                            // to build its children
                            buildTree(nodeData.children, childrenContainer);
                        } else {
                            // If no children, just show a "No children" message
                            childrenContainer.innerHTML = '<li>(No children)</li>';
                        }
                    }
                    
                    // Toggle the "open" class on the list item (li)
                    // This makes the CSS hide or show the children
                    li.classList.toggle('open');
                });
            });
        }

        // This is where the script starts
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('container');

            fetch('wiki.json')
                .then(response => response.json())
                .then(data => {
                    // Success! Clear the "Loading..." message
                    container.innerHTML = ''; 

                    // Create the root 'ul' for the whole tree
                    const rootUl = document.createElement('ul');
                    container.appendChild(rootUl);

                    // Start the tree-building process
                    buildTree(data, rootUl);
                })
                .catch(error => {
                    console.error('Error fetching the JSON:', error);
                    container.innerHTML = '<p style="color: red;">Error: Could not load data file.</p>';
                });
        });
    </script>

</body>
</html>
