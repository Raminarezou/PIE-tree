<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIE Etymology Tree</title>
    <style>
        /* Minimalist Styles */
        body { font-family: sans-serif; padding: 20px; }
        
        /* Tree styles */
        ul { list-style-type: none; padding-left: 20px; margin: 0; }
        ul ul { border-left: 1px solid #ccc; } /* Keep the subtle hierarchy line */
        
        /* This is the clickable item */
        .tree-node {
            cursor: pointer;
            padding: 5px 0;
            border-bottom: 1px solid #eee; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Style for the PageID number */
        .pageid {
            color: #555; 
            font-size: 0.85em;
            margin-left: 10px;
        }

        /* This holds the children, hidden by default */
        .tree-children {
            display: none;
            padding: 5px 0;
        }
        
        /* This class is added by JavaScript to show the children */
        .open > .tree-children {
            display: block;
        }
    </style>
</head>
<body>

    <h1>PIE Etymology Project</h1>
    
    <div id="container">
        <p>Loading data... (This may take a moment)</p>
    </div>

    <script>
        // Main function to build the tree, takes the current data and the element to attach to
        function buildTree(dataObject, parentElement) {
            const keys = Object.keys(dataObject);

            keys.forEach(key => {
                const nodeData = dataObject[key];
                const li = document.createElement('li');
                const node = document.createElement('div');
                node.className = 'tree-node';
                
                // --- Node Content ---
                const keySpan = document.createElement('span');
                keySpan.textContent = key;
                node.appendChild(keySpan);
                
                // Check and add the PageID
                if (nodeData && nodeData.identifier && nodeData.identifier.type === 'pageid' && nodeData.identifier.value) {
                    const pageIdSpan = document.createElement('span');
                    pageIdSpan.className = 'pageid';
                    pageIdSpan.textContent = `PageID: ${nodeData.identifier.value}`;
                    node.appendChild(pageIdSpan);
                }
                // --- End Node Content ---

                const childrenContainer = document.createElement('ul');
                childrenContainer.className = 'tree-children';

                li.appendChild(node);
                li.appendChild(childrenContainer);
                parentElement.appendChild(li);

                // Add the click listener for expansion
                node.addEventListener('click', (event) => {
                    // Prevent the click from bubbling up 
                    event.stopPropagation();

                    // If it's the first click, check for and build children
                    if (childrenContainer.innerHTML === '') {
                        const nextLevelData = nodeData.children;
                        if (Object.keys(nextLevelData).length > 0) {
                            buildTree(nextLevelData, childrenContainer);
                        } else {
                            childrenContainer.innerHTML = '<li style="padding: 5px 0; color:#999; font-size: 0.9em;">(No further children)</li>';
                        }
                    }
                    // Toggle the "open" class to show/hide the children
                    li.classList.toggle('open');
                });
            });
        }

        // This is where the script starts
        window.addEventListener('DOMContentLoaded', () => {
            const rootContainer = document.getElementById('container');

            fetch('wiki.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    rootContainer.innerHTML = ''; 
                    const rootUl = document.createElement('ul');
                    rootContainer.appendChild(rootUl);
                    
                    // Start the tree-building process from the root
                    buildTree(data, rootUl);
                })
                .catch(error => {
                    console.error('Error fetching the JSON:', error);
                    rootContainer.innerHTML = '<p style="color: red; padding: 20px;">Error: Could not load data file. Check the browser console for details.</p>';
                });
        });
    </script>

</body>
</html>
